    Object.keys(mem[coll]).forEach(function(id){if(!ids[id]&&!(coll==='ajustes'&&0))db.doc(coll+'/'+id).set(mem[coll][id]).catch(function(){})});
    saveMem();cache=null;dbState='ok';softRender()},function(){dbState='error';softRender()})}
function softRender(){if(tab==='count'&&idx>=0)return;if(tab==='cist')return;if(document.activeElement&&/INPUT/.test(document.activeElement.tagName)&&tab==='order')return;render()}
(function(){var c=window.claude;if(!c||!c.use){dbState='local';return}
  c.use('db').then(function(d){if(!d){dbState='local';softRender();return}db=d;try{sub('conteos');sub('pedidos');sub('ajustes');sub('lecturas')}catch(e){dbState='error'}},function(){dbState='local'});
  setTimeout(function(){if(dbState==='conectando'){dbState='local';softRender()}},11000)})();
/* ---------- eventos ---------- */
function render(){
  document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.tab===tab)});
  if(tab==='count'){if(idx>=0)viewWalk();else viewList()}else if(tab==='cist')viewCist();else if(tab==='cons')viewCons();else if(tab==='order')viewOrder();else viewHist()}
document.querySelector('.tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b){tab=b.dataset.tab;if(tab!=='count')idx=-1;render();window.scrollTo(0,0)}});
main.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;var p=tab==='cist'?BY.deogen:(idx>=0?P[idx]:null);
  if(t.dataset.open!=null){idx=+t.dataset.open;render();window.scrollTo(0,0);return}
  if(t.id==='start'){idx=P.findIndex(function(x){return !D[x.id].t});if(idx<0)idx=0;render();return}
  if(t.id==='save'){saveCount();return}
  if(t.dataset.step){var inp=main.querySelector('input[data-f="'+t.dataset.k+'"]'),f=p.fields.filter(function(x){return x.k===t.dataset.k})[0];
    var st=f.step<1?f.step:(f.step>=10?f.step:1);inp.value=Math.max(0,(+inp.value||0)+(+t.dataset.step)*st);inp.dispatchEvent(new Event('input',{bubbles:true}));return}
  if(t.id==='addg'){D[p.id].g.push(p.grgList?800:GRG);D[p.id].t=1;saveDraft();(tab==='cist'?viewCist():viewWalk());return}
  if(t.dataset.rmg!=null){D[p.id].g.splice(+t.dataset.rmg,1);D[p.id].t=1;saveDraft();(tab==='cist'?viewCist():viewWalk());return}
  if(t.id==='prev'){D[p.id].t=1;saveDraft();idx=Math.max(0,idx-1);render();window.scrollTo(0,0);return}
  if(t.id==='next'){D[p.id].t=1;saveDraft();if(idx===P.length-1){idx=-1}else idx++;render();window.scrollTo(0,0);return}
  if(t.id==='back'){D[p.id].t=1;saveDraft();idx=-1;render();return}
  if(t.dataset.rm){OV[t.dataset.rm]=0;sv('apq2-ov',OV);render();return}
  if(t.id==='addbtn'){var sl=document.getElementById('addsel');if(sl&&sl.value){var ap=BY[sl.value];OV[ap.id]=Math.max(1,pminOf(ap));sv('apq2-ov',OV);render()}return}
  if(t.id==='csave'){var f0=today(),ex=mem.conteos[f0]?JSON.parse(JSON.stringify(mem.conteos[f0])):{fecha:f0,litros:{},detalle:{}};ex.litros.deogen=tot(BY.deogen);ex.detalle=ex.detalle||{};ex.detalle.deogen={f:D.deogen.f,g:D.deogen.g};put('conteos',f0,ex).then(function(){toast('Nivel guardado ('+dmy(f0)+')');render()});return}
  if(t.id==='ccopy'){var c0=calc(BY.deogen);if(!c0.q){toast('Todavía no hace falta pedir');return}var tx='PEDIDO APQ · Deogen (cisterna) '+dmy(today())+'\n- Deogen: '+fmt(c0.q)+' L';
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tx).then(function(){t.textContent='Copiado'},function(){toast(tx)})}else toast(tx);return}
  if(t.id==='cmark'){var c1=calc(BY.deogen);if(!c1.q){toast('Todavía no hace falta pedir');return}
    put('pedidos',today()+'-cist',{fecha:today(),prov:'Deogen (tanque)',recibido:false,items:{deogen:{q:c1.q,n:'L',L:c1.q}}}).then(function(){delete OV.deogen;sv('apq2-ov',OV);toast('Pedido de cisterna anotado como en camino');render()});return}
  if(t.dataset.osup){osup=t.dataset.osup;render();window.scrollTo(0,0);return}
  if(t.dataset.oqd){var pq=t.dataset.oqd.split('|'),pp=BY[pq[0]],cc=calc(pp),dd=+pq[1],nv=cc.q+dd;if(cc.q===0&&dd>0)nv=Math.max(1,pminOf(pp));OV[pp.id]=Math.max(0,nv);sv('apq2-ov',OV);render();return}
  if(t.dataset.zd){ZD=Math.max(0,ZD+(+t.dataset.zd));sv('apq2-zd',ZD);render();return}
  if(t.dataset.ol){olSet(calc(BY.deogen).q+(+t.dataset.ol));return}
  if(t.id==='lsave'){lecSave();return}
  if(t.id==='lcsv'){lecCsvAll();return}
  if(t.id==='lpdf'){lecPdf();return}
  if(t.id==='lsend'){lecSend(t);return}
  if(t.id==='lcopy'){var sl=lecSelList();if(sl.length){var tt=lecText(sl),full='Asunto: '+tt.subject+'\n\n'+tt.body;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(full).then(function(){t.textContent='Copiado'},function(){toast('Mantén pulsado el texto para copiar')})}return}
  if(t.dataset.cper){cper=t.dataset.cper;render();return}
  if(t.dataset.cmail){var ml=mails(t.dataset.cmail).join('; ');if(!ml){toast('No hay correos');return}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ml).then(function(){t.textContent='Copiados'},function(){toast('Mantén pulsado el texto para copiar')})}else toast('Mantén pulsado el texto para copiar');return}
  if(t.id==='csv'){exportCsv();return}
  if(t.dataset.copy){var gg=t.dataset.copy;var txt=grpText(gg);var done=function(){t.textContent='Copiado'};
    var sel=function(){var r=document.createRange();r.selectNodeContents(document.getElementById('otxt-'+gg));var s=getSelection();s.removeAllRanges();s.addRange(r);t.textContent='Texto seleccionado'};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,sel)}else sel();return}
  if(t.dataset.mark){var gg=t.dataset.mark,its={};(window._g[gg]||[]).forEach(function(c){its[c.p.id]={q:c.q,n:c.p.ou.n,L:c.L}});if(gg==='zotal'&&ZD>0)its.zotaldep={q:ZD,n:'depósitos 200 L',L:ZD*200};
    put('pedidos',today()+'-'+gg,{fecha:today(),prov:GN[gg],recibido:false,items:its}).then(function(){(window._g[gg]||[]).forEach(function(c){delete OV[c.p.id]});if(gg==='zotal'){ZD=0;sv('apq2-zd',ZD)}sv('apq2-ov',OV);toast('Pedido anotado como en camino');render()});return}
  if(t.dataset.rec){var o=mem.pedidos[t.dataset.rec],its2=JSON.parse(JSON.stringify(o.items));Object.keys(its2).forEach(function(i){var inp=main.querySelector('input[data-rq="'+t.dataset.rec+'|'+i+'"]'),it=its2[i],lp=it.q>0?it.L/it.q:1,rq=inp&&inp.value!==''?+inp.value:it.q;it.rq=rq;it.Lr=rq*lp});put('pedidos',t.dataset.rec,Object.assign({},o,{recibido:true,recFecha:today(),items:its2})).then(function(){var ad=addStock(its2);toast('Pedido recibido'+(ad.length?' · sumado al stock':''));render()});return}
});
main.addEventListener('input',function(e){var el=e.target;if(el.id==='olit'){olSet(+el.value||0);return}
  if(el.dataset.lk!=null){var kk=+el.dataset.lk;LD.v[kk]=el.value===''?null:parseFloat(el.value);lsave();lecUpd(kk);lecAviso();return}
  if(!(tab==='cist'||(tab==='count'&&idx>=0)))return;var p=tab==='cist'?BY.deogen:P[idx],s=D[p.id];
  if(el.id==='pctin'){var pv=Math.min(100,Math.max(0,+el.value||0));s.f.cist=Math.round(pv*p.cap/100);var ci=main.querySelector('input[data-f="cist"]');if(ci)ci.value=s.f.cist}else if(el.dataset.f){s.f[el.dataset.f]=el.value===''?'':+el.value}else if(el.dataset.g!=null){s.g[+el.dataset.g]=el.value===''?0:+el.value}else return;
  s.t=1;saveDraft();refreshWalk()});
main.addEventListener('change',function(e){var el=e.target;
  if(el.id==='ci'||el.id==='en'){PAR.ciclo=+document.getElementById('ci').value||0;PAR.entrega=+document.getElementById('en').value||0;sv('apq2-par',PAR);render();return}
  if(el.dataset.lc!=null){LD.ck[+el.dataset.lc]=el.checked;lsave();lecAviso();return}
  if(el.id==='lfe'){LD.fe=el.value;lsave();lecRestore();return}
  if(el.id==='mm'){var a1=JSON.parse(JSON.stringify(aj()));if(!a1.mail)a1.mail={};a1.mail.mant=el.value.trim()?[el.value.trim()]:[];put('ajustes','main',a1).then(function(){toast('Correo guardado')});return}
  if(el.id==='zd'){ZD=Math.max(0,+el.value||0);sv('apq2-zd',ZD);render();return}
  if(el.dataset.mail){var a0=JSON.parse(JSON.stringify(aj()));if(!a0.mail)a0.mail={};a0.mail[el.dataset.mail]=el.value.split(/[\n;,]+/).map(function(x){return x.trim()}).filter(Boolean);put('ajustes','main',a0).then(function(){toast('Correos guardados')});return}
  if(el.dataset.a==='oq'){var oid=el.closest('details').dataset.id;OV[oid]=Math.max(0,+el.value||0);sv('apq2-ov',OV);render();return}
  if(el.dataset.a){var id=el.closest('details').dataset.id,a=JSON.parse(JSON.stringify(aj()));if(!a[el.dataset.a])a[el.dataset.a]={};
    a[el.dataset.a][id]=el.value===''?0:+el.value;put('ajustes','main',a).then(function(){render()})}});
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}
})();
